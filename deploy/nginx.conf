# GuinéeMall – Nginx en production (HTTPS obligatoire).
# Remplacer guineemall.gn, les chemins et ADMIN_URL (identique à la variable du .env).

upstream guineemall_app {
    server 127.0.0.1:8000;  # daphne config.asgi:application
}

server {
    listen 80;
    server_name guineemall.gn www.guineemall.gn;
    return 301 https://guineemall.gn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name guineemall.gn;

    ssl_certificate     /etc/letsencrypt/live/guineemall.gn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guineemall.gn/privkey.pem;

    client_max_body_size 30m;  # vidéos des statuts : 30 Mo maximum
    server_tokens off;

    # En-têtes de sécurité pour toutes les réponses
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    # Seuls les scripts du site s'exécutent : un script injecté ne peut pas voler de compte
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' wss://guineemall.gn; frame-src https://www.youtube.com https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Application React (fichiers construits par « npm run build »)
    root /srv/guineemall/frontend/dist;
    location / {
        try_files $uri /index.html;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # API, admin (adresse secrète), fichiers privés : Django
    location ~ ^/(api|ADMIN_URL|private)/ {
        proxy_pass http://guineemall_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Temps réel (messagerie, suivi du livreur, directs)
    location /ws/ {
        proxy_pass http://guineemall_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location /static/ {
        alias /srv/guineemall/backend/staticfiles/;
        expires 30d;
    }

    # Fichiers envoyés par les utilisateurs : jamais exécutés comme page web
    location /media/ {
        alias /srv/guineemall/backend/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
        expires 7d;
    }
    # Pièces jointes de la messagerie : téléchargées, jamais affichées dans le site
    location /media/chat/ {
        alias /srv/guineemall/backend/media/chat/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition "attachment" always;
    }

    # Le dossier private_media/ (pièces d'identité) n'est volontairement servi par AUCUN bloc :
    # il est lu uniquement par Django, pour l'équipe connectée.
}
